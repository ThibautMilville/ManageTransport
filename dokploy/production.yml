services:
  managetransport-frontend:
    image: ghcr.io/thibautmilville/managetransport-frontend:production
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://managetransport-backend:4000
    depends_on:
      - managetransport-backend
    networks:
      dokploy-network:
        aliases:
          - managetransport-frontend

  managetransport-backend:
    image: ghcr.io/thibautmilville/managetransport-backend:production
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      EMAIL_RECIPIENTS: ${EMAIL_RECIPIENTS}
    networks:
      dokploy-network:
        aliases:
          - managetransport-backend

networks:
  dokploy-network:
    external: true
